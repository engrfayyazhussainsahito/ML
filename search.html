<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search | MS Machine Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-root="" data-page-id="search" data-title="Search" data-track="false">
<a class="skip-link" href="#main">Skip to main content</a>
<div class="progress" id="readingProgress"></div>
<div class="mobile-topbar">
  <button id="openSidebar">☰ Navigation</button>
  <span style="font-family:var(--serif);font-weight:700;font-size:.95rem">MS Machine Learning</span>
  <button class="theme-toggle">🌙 Dark mode</button>
</div>
<div class="site-shell">
  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div class="brand"><span class="brand-mark">ML</span><div><h1>Machine Learning</h1><small>Interactive Learning Platform</small></div></div>
    <button id="closeSidebar" class="btn" style="margin:.25rem 0">✕ Close</button>
    <div class="nav-search">
      <label for="navSearch">Search lessons</label>
      <input id="navSearch" class="site-search-input" type="search" placeholder="Type to search…" autocomplete="off">
      <div class="mini-results search-results"></div>
    </div>
    <nav id="courseNav" aria-label="Course weeks"></nav>
    <section class="nav-group"><div class="nav-group-title">Your Progress</div><div id="progressList" class="progress-list small"></div></section>
  </aside>
  <main class="main" id="main">
    <div class="page-wrap">
      <nav class="breadcrumbs"><a href="index.html">Home</a><span>Search</span></nav>
      <section class="hero">
        <div class="eyebrow">Full-text search</div>
        <h1>Search All Lessons</h1>
        <p class="lead">Search across all lessons, weeks, and topics in the course.</p>
      </section>
      <div style="margin:1.25rem 0">
        <label for="mainSearch" style="font-weight:700;font-family:var(--sans);font-size:.9rem;display:block;margin-bottom:.4rem">Search query</label>
        <input id="mainSearch" class="site-search-input" type="search" placeholder="e.g. gradient descent, transformer, overfitting…" style="max-width:560px;padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;width:100%;font-size:1rem;background:var(--bg);color:var(--text)">
      </div>
      <div id="searchResults" class="search-results"></div>
      <footer class="footer"><p>© <span id="year"></span> MS Machine Learning Interactive Learning Platform.</p></footer>
    </div>
  </main>
</div>
<script src="assets/js/nav-data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/glossary-data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
